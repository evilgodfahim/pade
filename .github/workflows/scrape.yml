name: daily-epaper-extract

on:
  schedule:
    # 07:00 Asia/Dhaka = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system deps (jq used by mk_download.sh)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else echo "no requirements.txt"; fi

      - name: Run extractor
        env:
          EDITION_ID: '1'
          # Optional: set EDITION_DATE (DD/MM/YYYY) to override; leave blank to use BD date inside script
          EDITION_DATE: ${{ env.EDITION_DATE || '' }}
          FLARESOLVERR_URL: ${{ secrets.FLARESOLVERR_URL || '' }}
        run: |
          python extract_prothom_alo_orgids.py --edition "${EDITION_ID}" --date "${EDITION_DATE}" --output output/epaper || true

      - name: Run mk downloader (save JS/API/HTML into mk/)
        env:
          EDITION_ID: '1'
          EDITION_DATE: ${{ env.EDITION_DATE || '' }}
        run: |
          chmod +x mk_download.sh
          ./mk_download.sh "${EDITION_ID}" "${EDITION_DATE}" || true

      - name: Commit results (force-add XML/outputs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "---- workspace listing ----"
          ls -la || true
          echo "---- output dir ----"
          ls -la output || true
          echo "---- mk dir ----"
          ls -la mk || true

          # stage everything; force-add output/mk in case .gitignore blocks them
          git add -A
          git add -f output || true
          git add -f mk || true

          echo "---- git status (pre-commit) ----"
          git status --porcelain
          echo "---- git diff (names) staged ----"
          git diff --name-only --cached || true

          git commit -m "Daily epaper extract: $(date -u +'%Y-%m-%d %H:%M UTC')" || {
            echo "No changes to commit"
            git status --porcelain
            exit 0
          }

          git push origin HEAD:main || {
            echo "Push failed"
            git remote -v
            exit 1
          }