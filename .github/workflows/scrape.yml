name: daily-epaper-extract

on:
  schedule:
    # 09:00 Asia/Dhaka = 03:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    env:
      EDITION_ID: '1'
      EDITION_DATE: ''          # empty by default; available to steps as $EDITION_DATE
      FLARESOLVERR_URL: 'http://127.0.0.1:8191'
      UEMAIL: '1169c825b8'
      SEDID: '1'
      DELAY: '0.5'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl git ca-certificates

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies (if present)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Launch FlareSolverr container
        run: |
          docker rm -f flaresolverr 2>/dev/null || true
          docker run -d --name byparr -p 8191:8191 --restart=no ghcr.io/thephaseless/byparr:latest
          echo "waiting for flaresolverr to respond..."
          for i in $(seq 1 18); do
            if curl -sS --max-time 3 "${FLARESOLVERR_URL}" >/dev/null 2>&1; then
              echo "flaresolverr is up"
              break
            fi
            sleep 5
          done

      - name: Run extractor script
        run: |
          set -o pipefail
          python extract_prothom_alo_orgids.py --edition "$EDITION_ID" --date "$EDITION_DATE" || true

      - name: Collect XML and CSV artifacts
        run: |
          set -e
          mkdir -p artifacts/xml_csv
          if [ -d output ]; then
            find output -type f \( -iname '*.xml' -o -iname '*.csv' \) -exec cp --parents '{}' artifacts/xml_csv/ \; || true
          fi
          find . -maxdepth 2 -type f \( -iname '*.xml' -o -iname '*.csv' \) -not -path "./.git/*" -exec cp --parents '{}' artifacts/xml_csv/ \; || true
          echo "collected files:"
          ls -R artifacts/xml_csv || true

      - name: Commit collected XML/CSV back to repo
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -e
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"

          # Stage only xml/csv artifacts (and any existing output xml/csv)
          git add -A || true
          git add -f artifacts/xml_csv || true
          git add -f output/**/*.xml output/**/*.csv 2>/dev/null || true
          git add -f output/*.xml output/*.csv 2>/dev/null || true

          if git diff --cached --name-only | grep -E '\.xml$|\.csv$' >/dev/null 2>&1; then
            git commit -m "Daily epaper extract: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main
          else
            echo "No XML/CSV changes to commit."
          fi