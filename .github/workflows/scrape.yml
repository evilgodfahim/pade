name: daily-epaper-extract

on:
  schedule:
    # 07:00 Asia/Dhaka = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run extractor
        env:
          EDITION_ID: '1'
          EDITION_DATE: ${{ env.EDITION_DATE || '' }}
          FLARESOLVERR_URL: ${{ secrets.FLARESOLVERR_URL || '' }}
        run: |
          python extract_prothom_alo_orgids.py --edition "${EDITION_ID}" --date "${EDITION_DATE}" --output output/epaper || true

      - name: Run mk downloader (save JS/API/HTML into mk/)
        env:
          EDITION_ID: '1'
          EDITION_DATE: ${{ env.EDITION_DATE || '' }}
        run: |
          chmod +x mk_download.sh
          ./mk_download_sh || true

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output mk || true
          git commit -m "Daily epaper extract: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push failed"
